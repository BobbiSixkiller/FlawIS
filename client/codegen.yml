overwrite: true
schema: "../core/schema.graphql"
documents: "**/*.{gql,graphql}"
generates:
  src/lib/graphql/generated/:
    preset: "client"
    presetConfig:
      fragmentMasking: false
    config:
      documentMode: "string"
      enumType: "native"
      strictScalars: true
      scalars:
        ObjectId: "string"
        DateTimeISO:
          input: "string | Date"
          output: "string"
        JSONObject: "Record<string, unknown>"
    plugins: []
