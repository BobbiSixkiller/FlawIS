services:
  core:
    build:
      context: ./core
      dockerfile: Dockerfile
      target: development
    command: npm run dev
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      CONFERENCES_PUBLIC_HOST: conferences.localhost:3000
    depends_on:
      minio:
        condition: service_healthy
        restart: true
      rabbitmq:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
      mongo:
        condition: service_healthy
        restart: true
    volumes:
      - ./core:/usr/app
      - /usr/app/node_modules
    restart: unless-stopped
    ports:
      - "5001:5000"

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    command: npm run dev
    env_file:
      - ./.env
    environment:
      NODE_ENV: development
      API_URI: http://core:5000/graphql
      REACH_WEBHOOK_UPSTREAM_URL: http://core:5000/integrations/reach/webhooks
    depends_on:
      - core
    volumes:
      - ./client/:/usr/app
      - /usr/app/node_modules
    restart: unless-stopped
    ports:
      - "3000:3000"

  mail:
    build:
      context: ./mail
      dockerfile: Dockerfile
      target: development
    env_file:
      - ./.env
    command: npm run start:dev
    environment:
      NODE_ENV: development
      CORE_INTERNAL_URL: http://core:5000
      CLIENT_INTERNAL_URL: http://client:3000
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USER: ""
      MAIL_PASSWORD: ""
    depends_on:
      mailpit:
        condition: service_started
      client:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    volumes:
      - ./mail:/usr/app
      - /usr/app/node_modules
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit_data:/data

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_storage:/data
    environment:
      MINIO_ROOT_USER: root
      MINIO_ROOT_PASSWORD: Strong#Pass#2024
    command: server --console-address ":9001" /data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
  rabbitmq:
    hostname: flawis-rabbitmq-dev
    image: rabbitmq:4.1.3-alpine
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
    healthcheck:
      test: rabbitmq-diagnostics -q ping && rabbitmq-diagnostics -q status
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    environment:
      - RABBITMQ_ERLANG_COOKIE=flawis-rmq-cookie
  redis:
    image: redis:8.2-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "echo 'PING' | redis-cli -h redis -x"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
  mongo:
    build:
      context: ./mongo
      dockerfile: Dockerfile
    environment:
      # Avoid the MongoDB 8 TCMalloc/kernel incompatibility (SERVER-121912) locally.
      GLIBC_TUNABLES: glibc.pthread.rseq=1
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh mongo:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  mailpit_data: {}
  rabbitmq_data: {}
  mongo_data: {}
  mongo_config: {}
  minio_storage: {}
  redis_data: {}
